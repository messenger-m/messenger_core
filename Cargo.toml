[package]
name = "messenger_core"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
anyhow = "1.0.102"
axum = "0.8.8"
dotenvy = "0.15.7"
features = "0.10.0"
postgres = "0.19.12"
prost = "0.14.3"
redis = { version = "1.0.1", features = ["aio", "tokio-comp"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.15"
tonic = "0.14.5"
tonic-prost = "0.14.5"

[build-dependencies]
tonic-prost-build = "0.14.5"

[dependencies.sea-orm-migration]
version = "1.1"
features = ["sqlx-postgres", "runtime-tokio-native-tls"]
